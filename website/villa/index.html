<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Villa — The Villa Managers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232d251f'/><text x='50' y='66' font-size='40' font-family='Georgia' fill='%23e9dfd2' text-anchor='middle'>V</text></svg>">

  <meta name="description" content="Bali villa for monthly, yearly, and long-term rental — presented by The Villa Managers.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#f5f2ec;--white:#fff;--ink:#29241f;--muted:#746c64;--espresso:#29221d;--clay:#ad7e5c;--line:rgba(54,44,37,.13);--green:#4d6a56;--red:#a34e44}
    *{box-sizing:border-box}
    body{margin:0;font:16px/1.6 "DM Sans",sans-serif;color:var(--ink);background:var(--cream)}
    a{color:inherit}
    .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,4vw,50px);background:rgba(245,242,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .brand{font-family:"Bodoni Moda",serif;font-size:1.15rem;letter-spacing:.1em;text-decoration:none}
    .nav a.back{font-size:.8rem;color:var(--muted);text-decoration:none}
    .nav a.back:hover{color:var(--ink)}
    .wrap{max-width:1060px;margin:0 auto;padding:26px clamp(18px,4vw,50px) 80px}
    .hero{border-radius:4px;overflow:hidden;background:#e6e0d5;aspect-ratio:16/8;position:relative}
    .hero img{width:100%;height:100%;object-fit:cover;display:block}
    .hero .status{position:absolute;top:16px;left:16px;padding:7px 15px;background:rgba(41,34,29,.82);color:#fff;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(4px)}
    .head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:28px 0 8px;flex-wrap:wrap}
    h1{margin:0;font:400 clamp(2rem,5vw,3.2rem) "Bodoni Moda",serif;line-height:1.05}
    .loc{color:var(--muted);margin:6px 0 0}
    .specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:22px;padding:20px 0;border-block:1px solid var(--line);margin:22px 0;color:var(--muted);font-size:.9rem}
    .specs span{min-width:0}
    .specs b{display:block;color:var(--ink);font-size:1.15rem;font-weight:500;line-height:1.35}
    .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(26px,4vw,54px);align-items:start}
    h2{font:400 1.5rem "Bodoni Moda",serif;margin:0 0 16px}
    .fac{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:34px}
    .fac span{padding:8px 15px;border:1px solid var(--line);border-radius:22px;background:var(--white);font-size:.8rem;color:var(--muted)}
    .gallery{margin-top:48px}
    .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .gallery-grid button{padding:0;border:0;background:#e6e0d5;cursor:zoom-in;overflow:hidden;aspect-ratio:4/3}
    .gallery-grid img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s}
    .gallery-grid button:hover img{transform:scale(1.03)}
    dialog.lightbox{max-width:min(94vw,1200px);max-height:94vh;padding:0;border:0;background:transparent}
    dialog.lightbox::backdrop{background:rgba(20,17,14,.8)}
    .lightbox img{display:block;max-width:94vw;max-height:88vh;object-fit:contain}
    .lightbox button{position:absolute;top:10px;right:10px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:1.25rem;cursor:pointer}
    .cal-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
    .cal-month h4{margin:0 0 7px;font-size:.74rem;text-align:center;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
    .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:.58rem;color:var(--muted);background:var(--white)}
    .cal-d.booked{background:var(--espresso);color:#fff}
    .cal-d.blank{background:transparent}
    .legend{display:flex;gap:16px;margin-top:14px;font-size:.75rem;color:var(--muted)}
    .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
    .panel{position:sticky;top:86px;background:var(--white);border:1px solid var(--line);padding:26px}
    .panel h2{margin-bottom:6px}
    .panel p.small{margin:0 0 18px;color:var(--muted);font-size:.84rem}
    .f{margin-bottom:13px}
    .f label{display:block;margin-bottom:5px;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .f input,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);font:inherit;font-size:.9rem;background:var(--cream)}
    .f textarea{min-height:84px;resize:vertical}
    .btn{display:block;width:100%;padding:15px;border:0;background:var(--espresso);color:#fff;font:600 .78rem "DM Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    .btn:hover{background:#463a30}
    .wa{display:block;text-align:center;margin-top:12px;color:var(--clay);font-size:.85rem;text-decoration:none;font-weight:500}
    .msg{min-height:1.2em;margin:10px 0 0;font-size:.83rem;text-align:center}
    .others{margin-top:60px}
    .others-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .oc{display:block;text-decoration:none;background:var(--white);border:1px solid var(--line);overflow:hidden}
    .oc img,.oc .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
    .oc .ph{display:flex;align-items:center;justify-content:center;font-family:"Bodoni Moda",serif;font-size:1.6rem;color:#fff;background:linear-gradient(135deg,#d8c9ae,#b49b78)}
    .oc div.i{padding:13px 15px}
    .oc strong{font-weight:500}
    .oc small{display:block;color:var(--muted)}
    @media(max-width:860px){.grid{grid-template-columns:1fr}.panel{position:static}.gallery-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <nav class="nav"><a class="brand" href="/">TVM</a><a class="back" href="/#villas">← All villas</a></nav>
  <div class="wrap">
    <div class="hero" id="hero"><div class="status" id="status">Loading…</div></div>
    <div class="head"><div><h1 id="name">Loading villa…</h1><p class="loc" id="location-line"><span id="loc"></span><span id="map-wrap" hidden> | <a id="map-link" target="_blank" rel="noopener">Open in Google Maps</a></span></p><p class="loc" id="summary"></p></div></div>
    <div class="specs" id="specs"></div>
    <div class="grid">
      <div>
        <div id="fac-wrap" style="display:none"><h2>Facilities</h2><div class="fac" id="fac"></div></div>
        <h2>Availability — next 6 months</h2>
        <div class="cal-wrap" id="calendar"></div>
        <div class="legend"><span><span class="dot" style="background:var(--espresso)"></span>Booked</span><span><span class="dot" style="background:#fff;border:1px solid var(--line)"></span>Available</span></div>
      </div>
      <form class="panel" id="enq">
        <h2>Enquire about this villa</h2>
        <p class="small">Monthly, yearly, or long-term stays. We reply within a day.</p>
        <div class="f"><label>Your name</label><input name="name" required autocomplete="name"></div>
        <div class="f"><label>Email or WhatsApp</label><input name="contact" required placeholder="you@email.com or +62…"></div>
        <div class="f"><label>When & how long?</label><textarea name="message" required placeholder="e.g. From October, 6 months, 2 people"></textarea></div>
        <button class="btn" type="submit">Send enquiry</button>
        <a class="wa" id="wa-link" href="https://wa.me/6282122922252" target="_blank" rel="noopener">or WhatsApp us directly →</a>
        <p class="msg" id="msg"></p>
      </form>
    </div>
    <section class="gallery" id="gallery" hidden><h2>Photo gallery</h2><div class="gallery-grid" id="gallery-grid"></div></section>
    <div class="others"><h2>Other villas</h2><div class="others-grid" id="others"></div></div>
  </div>
  <dialog class="lightbox" id="lightbox"><button type="button" aria-label="Close photo">×</button><img alt="Villa photo"></dialog>
<script>
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const pageParams=new URLSearchParams(location.search);
  const pathSlug=location.pathname.match(/^\/villa\/([^/]+)\/?$/)?.[1]||'';
  const qName=(pageParams.get('v')||decodeURIComponent(pathSlug)).toLowerCase();
  let villa=null;
  const money=(value,currency)=>`${currency||'IDR'} ${Number(value||0).toLocaleString('en-US')}`;

  fetch('/api/public/villas').then(r=>r.json()).then(villas=>{
    villa=villas.find(v=>(v.slug||'').toLowerCase()===qName)||villas.find(v=>v.name.toLowerCase()===qName)||villas.find(v=>v.name.toLowerCase().includes(qName))||null;
    if(!villa){$('#name').textContent='Villa not found';$('#status').textContent='—';
      $('#loc').innerHTML='This villa may no longer be listed. <a href="/#villas">See all villas</a>.';renderOthers(villas);return}
    if(pageParams.has('v')&&villa.slug)history.replaceState(null,'',`/villa/${encodeURIComponent(villa.slug)}`);
    document.title=`${villa.name} — The Villa Managers`;
    $('#name').textContent=villa.name;
    $('#loc').textContent=villa.location||'Bali, Indonesia';
    $('#summary').textContent=villa.summary||'';
    if(villa.mapUrl){$('#map-link').href=villa.mapUrl;$('#map-wrap').hidden=false}
    $('#status').textContent=villa.status==='Booked'?'Currently booked · enquire for next dates':'Available';
    const photos=Array.isArray(villa.gallery)?villa.gallery:[];
    $('#hero').insertAdjacentHTML('afterbegin',villa.photoUrl?`<img src="${esc(villa.photoUrl)}" alt="${esc(villa.name)}">`:`<img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1600&q=85" alt="${esc(villa.name)}">`);
    if(photos.length){$('#gallery').hidden=false;$('#gallery-grid').innerHTML=photos.map((photo,index)=>`<button type="button" data-photo="${esc(photo)}" aria-label="View photo ${index+1} of ${photos.length}"><img src="${esc(photo)}" alt="${esc(villa.name)} — photo ${index+1}" loading="lazy"></button>`).join('')}
    $('#specs').innerHTML=[
      villa.bedrooms?`<span><b>${villa.bedrooms}</b>🛏️ Bedrooms</span>`:'',
      villa.bathrooms?`<span><b>${villa.bathrooms}</b>🛁 Bathrooms</span>`:'',
      villa.maxGuests?`<span><b>${villa.maxGuests}</b>👥 Guests</span>`:'',
      `<span><b>${villa.pool?'Yes':'—'}</b>🏊 Private pool</span>`,
      villa.yearlyRate?`<span><b>${esc(money(villa.yearlyRate,villa.currency))}</b>📅 Per year</span>`:'',
      villa.paymentTerms?`<span><b>${esc(villa.paymentTerms)}</b>💳 Payment terms</span>`:'',
    ].filter(Boolean).join('');
    if(villa.facilities){$('#fac-wrap').style.display='';
      $('#fac').innerHTML=villa.facilities.split(/,\s+/).map(f=>`<span>${esc(f.trim())}</span>`).join('')}
    renderCalendar(villa.bookedRanges||[]);
    const whatsapp=String(villa.publicWhatsApp||'6282122922252').replace(/\D/g,'');
    $('#wa-link').href=`https://wa.me/${whatsapp}?text=${encodeURIComponent(`Hi, I'm interested in ${villa.name}.`)}`;
    renderOthers(villas.filter(v=>v.name!==villa.name));
  }).catch(()=>{$('#name').textContent='Could not load villa'});

  function renderCalendar(ranges){
    const base=new Date();let html='';
    for(let m=0;m<6;m+=1){const y=base.getFullYear(),mo=base.getMonth()+m;const first=new Date(y,mo,1);
      const label=first.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
      const daysIn=new Date(y,mo+1,0).getDate();const startDow=(first.getDay()+6)%7;
      let cells='';for(let b=0;b<startDow;b+=1)cells+='<span class="cal-d blank"></span>';
      for(let d=1;d<=daysIn;d+=1){const iso=`${first.getFullYear()}-${String(first.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const booked=ranges.some(r=>r.from<=iso&&iso<r.to);
        cells+=`<span class="cal-d${booked?' booked':''}">${d}</span>`}
      html+=`<div class="cal-month"><h4>${esc(label)}</h4><div class="cal-days">${cells}</div></div>`}
    $('#calendar').innerHTML=html;
  }

  function renderOthers(list){
    $('#others').innerHTML=list.slice(0,4).map(v=>`<a class="oc" href="/villa/${encodeURIComponent(v.slug||v.name)}">
      ${v.photoUrl?`<img src="${esc(v.photoUrl)}" alt="">`:`<span class="ph">${esc(v.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>`}
      <div class="i"><strong>${esc(v.name)}</strong><small>${esc(v.location||'Bali')}</small></div></a>`).join('');
  }

  $('#gallery-grid').addEventListener('click',e=>{const photo=e.target.closest('[data-photo]')?.dataset.photo;if(!photo)return;const box=$('#lightbox');box.querySelector('img').src=photo;box.showModal()});
  $('#lightbox button').addEventListener('click',()=>$('#lightbox').close());
  $('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close()});

  $('#enq').addEventListener('submit',async e=>{
    e.preventDefault();const m=$('#msg');m.textContent='Sending…';m.style.color='var(--muted)';
    const f=Object.fromEntries(new FormData(e.currentTarget));
    const isEmail=/\S+@\S+\.\S+/.test(f.contact);
    try{
      const r=await fetch('/api/public/enquiries',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:f.name,email:isEmail?f.contact:'',phone:isEmail?'':f.contact,
          message:`Villa: ${villa?villa.name:qName}\n${f.message}`,source:pageParams.get('utm_source')||'Villa page',
          business:'The Villa Managers — Find a villa',leadType:'Renter',villaName:villa?villa.name:qName,
          utmSource:pageParams.get('utm_source'),utmMedium:pageParams.get('utm_medium'),utmCampaign:pageParams.get('utm_campaign'),landingPage:location.pathname})});
      if(!r.ok)throw new Error((await r.json()).error||'Failed');
      e.target.reset();m.textContent='✓ Sent! We\'ll reply within a day.';m.style.color='var(--green)';
    }catch(err){m.textContent='Could not send — please WhatsApp us.';m.style.color='var(--red)'}
  });
</script>
</body>
</html>
