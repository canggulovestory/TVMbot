server {
    listen 80;
    listen [::]:80;
    server_name zuzuzu.tech;
    root /var/www/zuzuzu-portfolio;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: https://thevillamanagers.cloud; base-uri 'none'; form-action https://wa.me; frame-ancestors 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /login { return 302 https://app.zuzuzu.tech/login; }
    location = /login/ { return 302 https://app.zuzuzu.tech/login; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location / { return 404; }
}
