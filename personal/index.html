<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zuzu Life</title><style>
:root{--ink:#2d1720;--wine:#551c2b;--cream:#f6f0e6;--paper:#fffdf9;--line:#e4d8ca;--muted:#786c66}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Arial,sans-serif}.shell{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:34px 0 60px}.hero{background:var(--wine);color:#fff;border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.mark{font:400 clamp(2rem,7vw,4.5rem)/.85 Georgia,serif;letter-spacing:-.06em}.hero p{margin:10px 0 0;color:#ead8d9;max-width:540px}.logout{border:1px solid #cda8ae;color:#fff;background:transparent;border-radius:9px;padding:8px 11px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr .9fr;gap:18px;margin-top:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}h2{font:400 1.55rem Georgia,serif;margin:0 0 5px}p.sub{margin:0;color:var(--muted);font-size:.9rem}.counts{display:flex;gap:10px;margin-top:18px}.count{flex:1;border-radius:12px;background:#f4e8df;padding:12px}.count strong{display:block;font-size:1.55rem}.form{display:grid;gap:9px;margin-top:16px}input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}textarea{min-height:72px;resize:vertical}.btn{border:0;background:var(--wine);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.items{display:grid;gap:9px;margin-top:15px}.item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px}.item.done{opacity:.52;text-decoration:line-through}.tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);font-weight:700}.item small{display:block;color:var(--muted)}.chat{height:290px;overflow:auto;background:#fbf7f1;border:1px solid var(--line);padding:12px;border-radius:12px;white-space:pre-wrap}.msg{margin:0 0 10px}.msg.me{color:var(--wine);font-weight:700}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}@media(max-width:750px){.grid{grid-template-columns:1fr}.shell{width:min(100% - 20px,1080px);padding-top:10px}.hero{border-radius:17px;padding:24px}.counts{gap:7px}}
</style></head><body><main id="app"></main><script>
const app=document.querySelector('#app'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let data=null;async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function login(){app.innerHTML=`<div class="login"><section class="card"><div class="mark" style="color:var(--wine)">zuzu</div><h2 style="margin-top:16px">Your private life space</h2><p class="sub">Separate from TVM. Plans, routines, goals and personal conversations live here.</p><form class="form" id="login"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn">Enter Zuzu Life</button></form></section></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/zuzu/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(x){alert(x.message)}}}function render(){const items=data.items||[];app.innerHTML=`<div class="shell"><header class="hero"><div><div class="mark">zuzu life</div><p>A quiet private place for your day, goals, notes and Zuzu. TVM client and business data do not appear here.</p></div><button class="logout" id="logout">Sign out</button></header><div class="grid"><section class="card"><h2>Today</h2><p class="sub">Keep life light, visible and moving.</p><div class="counts"><div class="count"><strong>${data.counts.tasks}</strong>tasks</div><div class="count"><strong>${data.counts.goals}</strong>goals</div><div class="count"><strong>${data.counts.habits}</strong>habits</div></div><form class="form" id="item"><select name="kind"><option value="task">Task</option><option value="goal">Goal</option><option value="habit">Habit</option><option value="note">Note</option></select><input name="title" placeholder="What matters now?" required><input name="dueDate" type="date"><textarea name="details" placeholder="Optional note"></textarea><button class="btn">Add to my life space</button></form><div class="items">${items.map(x=>`<label class="item ${x.done?'done':''}"><input type="checkbox" data-done="${esc(x.id)}" ${x.done?'checked':''}><div><span class="tag">${esc(x.kind)}</span><strong>${esc(x.title)}</strong>${x.dueDate?`<small>Due ${esc(x.dueDate)}</small>`:''}${x.details?`<small>${esc(x.details)}</small>`:''}</div></label>`).join('')||'<p class="sub">Start with one small thing.</p>'}</div></section><section class="card"><h2>Talk to Zuzu</h2><p class="sub">Personal reflection, planning and encouragement. She will not access TVM operations here.</p><div class="chat" id="chat"><p class="msg">Hi Afni. What would make today feel lighter?</p></div><form class="form" id="chat-form"><textarea name="message" placeholder="Talk to Zuzu…" required></textarea><button class="btn">Send</button></form></section></div></div>`;document.querySelector('#logout').onclick=async()=>{await api('/api/zuzu/logout',{method:'POST'});login()};document.querySelector('#item').onsubmit=async e=>{e.preventDefault();await api('/api/zuzu/items',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()};document.querySelectorAll('[data-done]').forEach(x=>x.onchange=async()=>{await api('/api/zuzu/items/complete',{method:'POST',body:JSON.stringify({id:x.dataset.done,done:x.checked})});load()});document.querySelector('#chat-form').onsubmit=async e=>{e.preventDefault();const input=e.target.message,msg=input.value.trim();if(!msg)return;input.value='';const box=document.querySelector('#chat');box.insertAdjacentHTML('beforeend',`<p class="msg me">You: ${esc(msg)}</p><p class="msg" id="wait">Zuzu is thinking…</p>`);box.scrollTop=box.scrollHeight;try{const r=await api('/api/zuzu/chat',{method:'POST',body:JSON.stringify({message:msg})});document.querySelector('#wait').textContent='Zuzu: '+r.reply}catch(x){document.querySelector('#wait').textContent=x.message}}}async function load(){try{data=await api('/api/zuzu/overview');render()}catch(_){login()}}load();
</script></body></html>
