<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My challenge · Zuzu private</title>
<style>
:root{--paper:#f7f3eb;--card:#fffdf8;--ink:#302820;--wine:#551c2b;--line:#e1d7c9;--muted:#72685e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:inherit;text-underline-offset:4px}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a36545;outline-offset:4px}.shell{width:min(1150px,calc(100% - 40px));margin:0 auto;padding:25px 0 50px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:0 0 25px}header p{font-size:13px;color:var(--muted);margin:2px 0}.mark{font:34px Georgia,serif;color:var(--wine)}.hero{background:var(--wine);color:#fff9f0;border-radius:18px;padding:30px;margin-bottom:20px}.hero h1{font:38px/1.1 Georgia,serif;margin:8px 0 14px}.hero p{margin:0;color:#ead9d1;max-width:740px}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase}.counts{display:flex;flex-wrap:wrap;gap:20px;margin-top:23px;font-size:14px}.counts strong{font-size:22px;margin-right:5px}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:25px;min-width:0}.card h2{font:29px/1.2 Georgia,serif;margin:0 0 15px}.sub{color:var(--muted);font-size:14px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px}button,.button{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:var(--card);color:var(--ink);text-decoration:none}.primary{background:var(--wine);color:white;border-color:var(--wine)}select,textarea{width:100%;background:white;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink)}.controls select{width:auto;flex:1;min-width:100px}.mission{padding:20px;background:#f0dfb9;border-radius:9px;margin-bottom:22px}.mission h3{font:25px/1.3 Georgia,serif;margin:8px 0}.field{border-top:1px solid var(--line);padding:17px 0}.field h3{font-size:15px;margin:0 0 7px}.field p{margin:0;font-size:15px;white-space:pre-wrap}.save{display:grid;gap:13px;border-top:1px solid var(--line);padding-top:22px}.save label{font-size:14px;display:grid;gap:6px}.save textarea{min-height:110px;resize:vertical}.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:15px}.wall button{padding:5px;min-height:46px;font-size:14px;background:#f3e6c9}.wall button[aria-current="true"]{outline:2px solid var(--wine);outline-offset:1px}.wall .done{background:#dce8d2}.wall .modified{background:#e6def1}.wall .skipped{background:#ece9e5;color:#72685e}.wall small{display:block;font-size:10px}.aside p{font-size:13px;color:var(--muted)}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}.guide{margin-top:20px}.guide-body{max-width:850px}.guide-body h1{font:32px Georgia,serif}.guide-body h2{font:27px Georgia,serif;margin:30px 0 14px}.guide-body h3{font:23px Georgia,serif}.guide-body p{white-space:pre-wrap;overflow-wrap:anywhere}.table-wrap{overflow-x:auto}.guide-body table{width:100%;border-collapse:collapse;font-size:14px}.guide-body th,.guide-body td{border:1px solid var(--line);padding:9px;text-align:left;min-width:125px}.error{color:#882f23;white-space:pre-wrap}.error:not(:empty){padding:12px;background:#ffe7df;border-radius:8px}.notice{font-size:14px;color:var(--muted);min-height:22px}.import{max-width:600px;margin:auto}.import input{display:block;width:100%;margin:20px 0}.hidden,[hidden]{display:none!important}@media(max-width:750px){.shell{width:calc(100% - 24px);padding-top:18px}.layout{grid-template-columns:1fr}.hero{padding:23px}.hero h1{font-size:32px}.card{padding:20px}.wall{grid-template-columns:repeat(6,1fr)}header{align-items:flex-start}.counts{gap:12px}.counts strong{font-size:20px}.controls{gap:6px}.controls button{padding:8px 10px}.hero p{font-size:14px}.guide-body p{font-size:15px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><div class="shell"><header><div><div class="mark">zuzu life</div><p>Your private space</p></div><div><a class="button" href="/">← Chat & records</a> <button id="export-private">Export private data</button></div></header><p id="error" class="error" role="alert"></p><main id="app" aria-busy="true"><p>Loading your private challenge…</p></main></div>
<script>
'use strict';
const app=document.querySelector('#app'),errorBox=document.querySelector('#error');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(value){return esc(value).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function guideMarkup(source){
 const lines=source.split('\n');let html='';
 for(let i=0;i<lines.length;i++){
  const line=lines[i];if(!line.trim())continue;
  const heading=line.match(/^(#{1,3}) (.+)$/);if(heading){html+=`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;continue}
  if(line.startsWith('|')){const rows=[];while(i<lines.length&&lines[i].startsWith('|')){const row=lines[i++];if(!/^\|[\s:|\-]+$/.test(row))rows.push(row.slice(1,-1).split('|'))}i--;html+='<div class="table-wrap"><table>'+rows.map((row,j)=>'<tr>'+row.map(cell=>`<${j?'td':'th'}>${inline(cell.trim())}</${j?'td':'th'}>`).join('')+'</tr>').join('')+'</table></div>';continue}
  html+=`<p>${inline(line)}</p>`;
 }
 return html;
}
async function api(url,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const r=await fetch(url,{...options,headers:{'Content-Type':'application/json'},signal:controller.signal});if(r.status===401){location.href='/login';throw Error('Please sign in again.')};const body=await r.json();if(!r.ok)throw Error(body.error||'Could not save. Please try again.');return body}
 catch(error){if(error.name==='AbortError')throw Error('The request timed out. Check the saved state before retrying.');throw error}finally{clearTimeout(timer)}
}
let plan=null,selected=1,dirty=false,saving=false;
const fields=[['training','🏋️ Umrah training'],['ugc','🎥 UGC / money'],['arabic','🗣️ Arabic course'],['spiritual','🕌 Spiritual'],['health','🥗 Health'],['mind','🧠 Mind']];
function todayISO(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Makassar',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-')}
function todayDay(){const iso=todayISO();return plan.days.find(d=>d.date===iso)?.day||(iso<plan.days[0].date?1:90)}
function switchDay(day){if(saving)return;if(dirty&&!confirm('Leave this day without saving your changes?'))return;selected=Math.max(1,Math.min(90,Number(day)));dirty=false;render()}
function render(){
 app.setAttribute('aria-busy','false');
 if(!plan){app.innerHTML='<section class="card import"><h1>My 90-day challenge</h1><p>Import your prepared challenge file. It will be stored only in your private account.</p><form id="import"><label for="plan-file">Challenge file (JSON)</label><input id="plan-file" name="file" type="file" accept="application/json,.json" required><button class="primary">Import my challenge</button><p class="notice" id="import-state" role="status"></p></form></section>';document.querySelector('#import').onsubmit=importPlan;return}
 const day=plan.days[selected-1],progress=plan.progress[String(selected)]||{status:'pending',note:''};
 const count=status=>Object.values(plan.progress).filter(p=>p.status===status).length;
 const date=new Date(day.date+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Makassar'});
 app.innerHTML=`<section class="hero"><span class="label">Private · ${esc(plan.days[0].date)} — ${esc(plan.days[89].date)}</span><h1>${esc(plan.title)}</h1><p>One day at a time. Complete, modify or miss a day honestly—then continue. Your personal plan stays here.</p><div class="counts"><span><strong>${count('done')}</strong>completed</span><span><strong>${count('modified')}</strong>modified</span><span><strong>${count('skipped')}</strong>missed</span><span><strong>${90-count('done')-count('modified')-count('skipped')}</strong>not marked</span></div></section><div class="layout"><section class="card"><div class="controls"><button id="prev" ${selected===1?'disabled':''} aria-label="Previous day">←</button><label class="hidden" for="day-picker">Choose a day</label><select id="day-picker" aria-label="Choose a day">${plan.days.map(d=>`<option value="${d.day}" ${d.day===selected?'selected':''}>Day ${d.day} · ${d.date}</option>`).join('')}</select><button id="next" ${selected===90?'disabled':''} aria-label="Next day">→</button><button id="today">Today</button></div><p class="sub">Phase ${Math.ceil(selected/30)} · ${date}</p><div class="mission"><span class="label">Day ${selected} · Sticky-note mission</span><h3>${inline(day.mission)}</h3></div>${fields.map(([key,label])=>`<div class="field"><h3>${label}</h3><p>${inline(day[key])}</p></div>`).join('')}${selected%7===0?'<p class="sub">📊 Seven-day review today. Use the full-guide checklist below inside your business/admin block.</p>':''}<form id="save" class="save"><label>How did this day go?<select name="status">${[['pending','Not marked yet'],['done','Completed'],['modified','Modified / minimum version'],['skipped','Missed — continue tomorrow']].map(([v,t])=>`<option value="${v}" ${progress.status===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Your notes<textarea name="note" maxlength="2000" placeholder="Walking, course progress, UGC actions, or a short reflection…">${esc(progress.note)}</textarea></label><button class="primary" type="submit">Save day ${selected}</button><p id="saved" class="notice" role="status">${progress.updatedAt?'Saved previously.':''}</p></form></section><aside class="card aside"><details open><summary>My 90-day wall</summary><p>Choose any day. Green = completed · purple = modified · grey = missed.</p><div class="wall">${plan.days.map(d=>{const status=plan.progress[String(d.day)]?.status||'pending';return `<button data-day="${d.day}" class="${status}" aria-current="${d.day===selected}" aria-label="Day ${d.day}, ${d.date}, ${status}">${d.day}<small>${d.date.slice(5)}</small></button>`}).join('')}</div></details><p>Arabic follows the four sessions in your plan. A missed session does not require restarting.</p></aside></div><section class="card guide"><details id="guide"><summary>Full guide · training, Arabic, money, reviews & continuation</summary><div class="guide-body">${guideMarkup(plan.guide)}</div></details></section>`;
 document.querySelector('#prev').onclick=()=>switchDay(selected-1);document.querySelector('#next').onclick=()=>switchDay(selected+1);document.querySelector('#today').onclick=()=>switchDay(todayDay());document.querySelector('#day-picker').onchange=e=>switchDay(e.target.value);document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>switchDay(b.dataset.day));
 const form=document.querySelector('#save');form.oninput=()=>{dirty=true;document.querySelector('#saved').textContent='Unsaved changes.'};
 form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');if(button.disabled)return;const payload={day:selected,...Object.fromEntries(new FormData(form))};saving=true;form.querySelectorAll('select,textarea,button').forEach(el=>el.disabled=true);errorBox.textContent='';const savingDay=selected;try{const result=await api('/api/zuzu/challenge/day',{method:'POST',body:JSON.stringify(payload)});plan.progress[String(savingDay)]=result.progress;dirty=false;render();document.querySelector('#saved').textContent='Saved to your private account.'}catch(error){errorBox.textContent=error.message;form.querySelectorAll('select,textarea,button').forEach(el=>el.disabled=false)}finally{saving=false}};
}
async function importPlan(event){event.preventDefault();const form=event.target,file=form.elements.file.files[0],button=form.querySelector('button');if(button.disabled)return;button.disabled=true;errorBox.textContent='';try{if(!file||file.size>384*1024)throw Error('Choose a JSON challenge file smaller than 384 KB.');document.querySelector('#import-state').textContent='Importing privately…';const input=JSON.parse(await file.text());const result=await api('/api/zuzu/challenge/import',{method:'POST',body:JSON.stringify(input)});plan=result.challenge;selected=todayDay();render()}catch(error){errorBox.textContent=error.message;button.disabled=false;document.querySelector('#import-state').textContent='Not imported.'}}
document.querySelector('#export-private').onclick=async()=>{
 try {
  const items=[];let offset=0,more=true;
  while(more){const page=await api('/api/zuzu/overview?offset='+offset);items.push(...page.items);offset+=page.items.length;more=page.hasMore;if(more&&!page.items.length)throw Error('Could not export all records.');}
  const challenge=(await api('/api/zuzu/challenge')).challenge;
  app.innerHTML='<section class="card"><h1>Private data export</h1><p>This backup contains your records and challenge. Keep it private.</p><pre id="private-export" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section>';
  document.querySelector('#private-export').textContent=JSON.stringify({version:1,items,challenges:challenge?{afni:challenge}:{}},null,2);
 }catch(error){errorBox.textContent=error.message;}
};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
api('/api/zuzu/challenge').then(result=>{plan=result.challenge;if(plan)selected=todayDay();render()}).catch(error=>{app.setAttribute('aria-busy','false');app.textContent='Unable to load the challenge. Please reload or return to your private records.';errorBox.textContent=error.message});
</script></body></html>
