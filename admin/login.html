<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in — The Villa Managers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1915'/><text x='50' y='66' font-size='40' font-family='Georgia' fill='%23f3ecdf' text-anchor='middle'>V</text></svg>">

  <style>
    :root{--bg:#edebe7;--card:#fff;--ink:#191713;--muted:#8b8478;--line:#e7e3db;--gold:#b49164;--espresso:#1c1915}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
      background:var(--bg);background-image:radial-gradient(circle at 80% 10%,rgba(180,145,100,.1),transparent 45%)}
    .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;
      box-shadow:0 1px 2px rgba(27,24,19,.04),0 20px 50px rgba(27,24,19,.09);padding:38px 34px}
    .logo{width:46px;height:46px;border-radius:13px;background:var(--espresso);color:#fff;display:flex;
      align-items:center;justify-content:center;font-weight:700;font-size:.9rem;margin-bottom:20px}
    h1{margin:0 0 4px;font-size:1.35rem}
    .sub{margin:0 0 26px;color:var(--muted);font-size:.85rem}
    label{display:block;margin-bottom:6px;color:var(--muted);font-size:.76rem;font-weight:600}
    input{width:100%;padding:12px 14px;border:1.5px solid #ddd5c8;border-radius:11px;font:inherit;background:#fff;margin-bottom:15px}
    input:focus{outline:2.5px solid #e8dcc6;border-color:var(--gold)}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--espresso);color:#fff;
      font:600 .92rem inherit;cursor:pointer;transition:background .2s}
    button:hover{background:#3a332b}
    button:disabled{opacity:.6;cursor:wait}
    .msg{min-height:1.3em;margin:13px 0 0;color:#b0483c;font-size:.82rem;text-align:center}
    .foot{margin-top:22px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:.74rem;text-align:center}
  </style>
</head>
<body>
  <form class="box" id="f">
    <div class="logo">TVM</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to The Villa Managers — team dashboard or owner portal.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="b">Sign in</button>
    <p class="msg" id="m"></p>
    <p class="foot">Villa owner? Your account opens your villa's portal automatically.<br>The Villa Managers · Bali</p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const b = document.getElementById('b'), m = document.getElementById('m');
      b.disabled = true; m.textContent = '';
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Sign in failed.');
        location.href = '/admin/'; // owners are routed to /owner automatically
      } catch (err) { m.textContent = err.message; b.disabled = false; }
    });
  </script>
</body>
</html>
