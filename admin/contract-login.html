<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Contract access | The Villa Managers</title><script src="/contract/login.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8ece7;color:#193d36;font:16px/1.5 system-ui,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:32px;background:white;border-radius:18px;box-shadow:0 8px 32px #193d3610}.brand{font-size:22px;font-weight:750;color:#155e50}h1{font-size:26px;margin:22px 0 6px}p{color:#657971;margin:0 0 24px}label{display:block;font-size:14px;font-weight:600}input{display:block;width:100%;font:inherit;padding:12px;border:1px solid #cbd6cf;border-radius:7px;margin:7px 0 18px}button{width:100%;background:#155e50;color:white;border:0;border-radius:7px;font:600 16px system-ui;padding:14px;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #b88e34;outline-offset:2px}#error{color:#ac3026;font-size:14px;margin:16px 0 0}#error:empty{display:none}
</style></head><body><main class="card"><div class="brand">TVM</div><h1>Contract Builder</h1><p>Enter the team password to continue.</p><form id="contract-login"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus><button id="sign-in" type="submit">Open contracts</button><p id="error" role="alert"></p></form></main></body></html>
